name: test

# Only main on push. A pull request branch is already covered by the
# pull_request event, and listing both ran the whole matrix twice against the
# same commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run is wasted work, so cancel it -- except on main, where each
# push is a distinct commit whose result is worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The matrix exists to hold the README's "Python 3.11+" claim honest: floor,
  # middle, and newest on Linux, plus one version each on macOS and Windows.
  # If you turn on branch protection, pin all of these job names as required
  # checks -- a matrix job that is not listed is not enforced, and the names
  # here carry the OS: `test (ubuntu-latest, 3.11)`, not `test (3.11)`.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose: the tool is standard library only, and a
      # dependency creeping in should break the build here rather than quietly
      # in someone's clone.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t tests -v

      - name: Check the tool runs end to end
        # bash on all three runners, so -e stops at the first failure. pwsh
        # propagates only the last command's exit code, which would let a
        # broken `claims` sail through on Windows.
        shell: bash
        run: |
          # The sample deliberately contains an uncited entry, so check exits 2.
          status=0
          python scripts/touchneedle.py check tests/fixtures/sample.md \
            --offline --out "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/data.json" || status=$?
          test "$status" -eq 2
          python scripts/touchneedle.py claims tests/fixtures/sample.md \
            --out "$RUNNER_TEMP/claims.md"
          python -c "import os, pathlib; assert '8 reference entries' in pathlib.Path(os.environ['RUNNER_TEMP'], 'report.md').read_text(encoding='utf-8')"

  # Dev-only tooling, installed here and nowhere else -- the package itself
  # still has zero runtime dependencies, and the `test` job above deliberately
  # installs nothing so a dependency creeping in breaks the build.
  # `ruff check` only, never `ruff format`: see the note in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # --group needs pip 25.1+; upgrading is cheaper than debugging a runner
      # image that shipped an older one.
      - name: Install ruff and mypy
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - run: ruff check .
      - run: mypy scripts/touchneedle.py

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if any generated file is stale: the plugin's bundled skill, or a
      # version stamp behind __version__ in scripts/touchneedle.py.
      - name: Plugin skill is in sync
        run: |
          bash scripts/sync-plugin-skill.sh
          if ! git diff --quiet; then
            echo "::error::generated files are stale -- run scripts/sync-plugin-skill.sh and commit"
            git diff --stat
            exit 1
          fi

      # Being byte-identical to the source is not the same as running. SKILL.md
      # invokes the checker by a path relative to itself, so the copy is only
      # useful if that path resolves inside the plugin layout.
      - name: The bundled copy runs
        run: |
          status=0
          python3 plugins/touchneedle/skills/touchneedle/scripts/touchneedle.py \
            check tests/fixtures/sample.md --offline > /dev/null || status=$?
          test "$status" -eq 2

  # pyproject wires four things together -- py-modules, package-dir, the dynamic
  # version read from __version__, and the console entry point -- so that
  # SKILL.md and pip share one file. None of it was exercised until a release
  # was already being cut. publish.yml runs the same two build commands; that
  # duplication is the point, because here a mistake is still cheap.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*

      # Installing the wheel and running the console script exercises all four
      # of those directives at once. A version that disagrees with the module
      # means setuptools and sync-plugin-skill.sh are reading __version__
      # differently, which is otherwise invisible until PyPI has the artefact.
      - name: The installed console script runs
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          installed="$(/tmp/wheeltest/bin/touchneedle --version)"
          source="$(python scripts/touchneedle.py --version)"
          echo "installed: $installed / source: $source"
          [ "$installed" = "$source" ]

  # The suite's pandoc test guards itself with skipUnless, so that a contributor
  # without pandoc is not made to install it. No runner has pandoc either, which
  # left the test skipping everywhere and reporting green. This is the one job
  # where it actually runs. Ubuntu only: the test forces LC_ALL=C to get an
  # ASCII stdout, and Windows ignores LC_ALL.
  pandoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: sudo apt-get install -y pandoc

      - name: Run the test suite with pandoc present
        run: python -m unittest discover -s tests -t tests -v
